<footer class="site-footer">
  <div class="wrap footer-row">
    <p>© {{ now.Year }} {{ site.Params.author }} · {{ site.Title }}</p>
    <p class="footer-links">
      {{ with site.Params.github }}<a href="https://github.com/{{ . }}">GitHub</a>{{ end }}
      {{ with site.Params.linkedin }}<a href="{{ . }}">LinkedIn</a>{{ end }}
      {{ with site.Params.email }}<a href="mailto:{{ . }}">E-posta</a>{{ end }}
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </p>
  </div>
</footer>
