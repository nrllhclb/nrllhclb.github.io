{{ if gt .TotalPages 1 }}
<nav class="pager" aria-label="Sayfalar">
  {{ with .Prev }}<a href="{{ .URL }}">← Daha yeni</a>{{ else }}<span></span>{{ end }}
  <span class="muted">{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{ with .Next }}<a href="{{ .URL }}">Daha eski →</a>{{ else }}<span></span>{{ end }}
</nav>
{{ end }}
