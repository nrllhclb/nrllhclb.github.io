{{ define "main" }}
<header class="page-head">
  <h1>{{ if eq .Data.Plural "kategoriler" }}Kategoriler{{ else }}Etiketler{{ end }}</h1>
</header>
<ul class="term-cloud">
  {{ range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} <span>{{ .Count }}</span></a></li>
  {{ end }}
</ul>
{{ end }}
